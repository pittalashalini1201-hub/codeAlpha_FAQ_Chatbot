<!DOCTYPE html>
<html>
<head>
    <title>AI FAQ Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="chat-container">
        <h1>🤖 AI FAQ Chatbot</h1>

        <form method="POST">
            <textarea name="question" placeholder="Ask an AI-related question..." required></textarea>
            <br>
            <button type="submit">Ask Chatbot</button>
        </form>

        {% if response %}
        <div class="response">
            <h3>Chatbot Response:</h3>
            <p>{{ response }}</p>
        </div>
        {% endif %}

        <div class="examples">
            <h4>Example Questions</h4>
            <ul>
                <li>What is artificial intelligence?</li>
                <li>What is machine learning?</li>
                <li>What is NLP?</li>
                <li>What is Python?</li>
            </ul>
        </div>
    </div>

</body>
</html>
